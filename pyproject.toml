[project]
name = "qilupulse96"
version = "0.1.0"
description = "Auditable QiluPulse-96 realtime electricity-price forecasting for Shandong"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "XYuki" }]
license = { file = "LICENSE" }
dependencies = [
    "holidays>=0.40",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pvlib>=0.15,<0.16",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
